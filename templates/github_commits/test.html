<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Commit Details</title>
    <script>
        async function fetchCommitDetails() {
            const owner = document.getElementById("owner").value.trim();
            const repo = document.getElementById("repo").value.trim();
            const sha = document.getElementById("sha").value.trim();
            const commitDetailsContainer = document.getElementById("commit-details");

            // Clear previous results
            commitDetailsContainer.innerHTML = "";

            // Validate inputs
            if (!owner || !repo || !sha) {
                alert("Please fill in all fields: Owner, Repo, and SHA.");
                return;
            }

            // GitHub API URL
            const url = `https://api.github.com/repos/${owner}/${repo}/commits/${sha}`;

            try {
                // Fetch the commit details
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Error: ${response.status} - ${response.statusText}`);
                }

                const commitData = await response.json();
                console.log(commitData);

                // Display the commit details
                commitDetailsContainer.innerHTML = `
                    <h3>Commit Details:</h3>
                    <p><strong>SHA:</strong> ${commitData.sha}</p>
                    <p><strong>Message:</strong> ${commitData.commit.message}</p>
                    <p><strong>Author:</strong> ${commitData.commit.author.name}</p>
                    <p><strong>Email:</strong> ${commitData.commit.author.email}</p>
                    <p><strong>Date:</strong> ${commitData.commit.author.date}</p>
                    <p><strong>URL:</strong> <a href="${commitData.html_url}" target="_blank">${commitData.html_url}</a></p>
                `;
            } catch (error) {
                commitDetailsContainer.innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        }
    </script>
</head>
<body>
    <h1>Fetch Commit Details</h1>
    <form onsubmit="fetchCommitDetails(); return false;">
        <label for="owner">Repository Owner:</label>
        <input type="text" id="owner" placeholder="e.g., torvalds" required><br><br>

        <label for="repo">Repository Name:</label>
        <input type="text" id="repo" placeholder="e.g., linux" required><br><br>

        <label for="sha">Commit SHA:</label>
        <input type="text" id="sha" placeholder="e.g., 4a58c29d772c4d0b1e8b45cfb4e7c417d1cfdc8f" required><br><br>

        <button type="submit">Fetch Commit Details</button>
    </form>

    <div id="commit-details" style="margin-top: 20px;"></div>
</body>
</html>
